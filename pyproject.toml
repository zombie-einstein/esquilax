[project]
name = "esquilax"
version = "3.0.0"
description = "JAX multi-agent simulation and ML toolset"
readme = "README.md"
authors = [
    { name = "zombie-einstein", email = "zombie-einstein@proton.me" }
]
maintainers = [
    { name = "zombie-einstein", email = "zombie-einstein@proton.me" }
]
keywords = [
  "agent-based modelling",
  "simulation",
  "reinforcement-learning",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Artificial Life",
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "chex>=0.1.92",
    "jax>=0.12.0.1",
    "jax-tqdm>=0.4.0",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "piccolo-theme>=0.24.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "sphinx>=9.1.1",
    "sphinx-autoapi>=3.8.1",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
test = { cmd = "pytest tests", help="Run tests"}
lint = { cmd = "pre-commit run --all-files", help="Code format checks"}
docs = { cmd = "sphinx-build -W -b html docs/source docs/build", help="Build docs"}
doc-tests = { cmd = "sphinx-build -W -b doctest docs/source docs/build", help="Run sphinx doc-tests"}
pre-commit = "task test && task lint && task docs && task doc-tests"
